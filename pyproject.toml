[project]
name = "customer-support-agentic-ai-system"
version = "0.1.0"
description = "Customer Support Agentic AI System"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.4",
    "boto3-stubs[dynamodb,lambda,s3,secretmanager,sns,sqs,stepfunctions]>=1.44.4",
    "fastapi[standard]>=0.163.1",
    "langchain>=1.4.6",
    "langchain-aws>=1.9.3",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.15",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "regex>=2026.9.29",
    "streamlit>=1.65.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
